name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore PayFlow.slnx

      - name: Build (warnings are errors)
        run: dotnet build PayFlow.slnx --configuration Release --no-restore

      - name: Unit and architecture tests
        run: >
          dotnet test PayFlow.slnx --configuration Release --no-build
          --filter "FullyQualifiedName!~PayFlow.IntegrationTests"
          --logger "trx;LogFileSuffix=unit" --results-directory TestResults

      # Real PostgreSQL and the real Service Bus emulator, started by Testcontainers (Docker is preinstalled).
      - name: Integration tests
        run: >
          dotnet test tests/IntegrationTests --configuration Release --no-build
          --logger "trx;LogFileSuffix=integration" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -recursive

      # No backend and no Azure credentials: this only proves the configuration is internally consistent.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render manifests
        run: kubectl kustomize deploy/kubernetes > rendered.yaml

      - name: Every placeholder must be one the deploy step substitutes
        run: |
          names=(ACR_LOGIN_SERVER IMAGE_TAG KEY_VAULT_NAME ORDER_SERVICE_CLIENT_ID PAYMENT_SERVICE_CLIENT_ID PROVIDER_SIMULATOR_CLIENT_ID SERVICE_BUS_FQDN TENANT_ID)
          wanted=$(printf '%s\n' "${names[@]}" | sort)
          # shellcheck disable=SC2016  # the literal ${NAME} text is exactly what is being searched for
          found=$(grep -o '\${[A-Z_]*}' rendered.yaml | tr -d '${}' | sort -u)
          diff <(echo "$wanted") <(echo "$found") && echo "placeholders match"

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [order-service, payment-service, provider-simulator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.service }}
          tags: payflow/${{ matrix.service }}:ci
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Fails the build only for CRITICAL vulnerabilities that already have a fix, so the pipeline stays
      # actionable instead of going red for issues nobody can resolve yet.
      - name: Scan for vulnerabilities (Trivy)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
          image --severity CRITICAL --ignore-unfixed --exit-code 1 payflow/${{ matrix.service }}:ci
