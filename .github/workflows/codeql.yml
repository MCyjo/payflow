name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Code scanning on a private repository needs GitHub Advanced Security (paid). It is free on public
    # repositories, so this job simply starts running once the repository is made public.
    if: github.repository_visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build PayFlow.slnx --configuration Release
      - uses: github/codeql-action/analyze@v3
