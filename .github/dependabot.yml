version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      azure-sdk:
        patterns: ["Azure.*", "Microsoft.Azure.*"]
      ef-core:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql*"]
      # Test tooling moves in lockstep across every test project: one pull request, one CI run, no merge conflicts.
      test-tooling:
        patterns: ["Microsoft.NET.Test.Sdk", "xunit*"]
    ignore:
      # Not used (it only came with the xunit template and nothing collects coverage); removed from the test projects.
      - dependency-name: "coverlet.collector"
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      # One pull request for all action updates instead of one per action.
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: weekly }
    ignore:
      # azurerm 5 is a breaking upgrade (for example AKS now requires node_provisioning_profile). Migrate it as a
      # deliberate change verified with a real plan, not through a bot pull request.
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
