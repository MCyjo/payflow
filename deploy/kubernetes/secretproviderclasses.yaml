# Key Vault secrets are mounted by the CSI driver using the pod's workload identity and mirrored into a
# Kubernetes Secret that the Deployment reads as environment variables. No secret is stored in this repository.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: order-service
  namespace: payflow
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${ORDER_SERVICE_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    tenantId: ${TENANT_ID}
    objects: |
      array:
        - |
          objectName: orders-connection-string
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
  secretObjects:
    - secretName: order-service-secrets
      type: Opaque
      data:
        - objectName: orders-connection-string
          key: ConnectionStrings__Orders
        - objectName: appinsights-connection-string
          key: APPLICATIONINSIGHTS_CONNECTION_STRING
---
