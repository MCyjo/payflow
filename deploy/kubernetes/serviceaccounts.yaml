# Each service account is federated with one managed identity (infra/terraform/modules/security).
# The annotation tells the workload-identity webhook which Entra ID client the pod may act as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: payflow
  annotations:
    azure.workload.identity/client-id: ${ORDER_SERVICE_CLIENT_ID}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  namespace: payflow
  annotations:
    azure.workload.identity/client-id: ${PAYMENT_SERVICE_CLIENT_ID}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-simulator
  namespace: payflow
  annotations:
    azure.workload.identity/client-id: ${PROVIDER_SIMULATOR_CLIENT_ID}
