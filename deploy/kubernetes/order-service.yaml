apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: payflow
  labels: { app: order-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels:
        app: order-service
        azure.workload.identity/use: "true"   # injects the federated token the SDKs exchange for an Entra ID token
    spec:
      serviceAccountName: order-service
      terminationGracePeriodSeconds: 45       # > the 30 s host shutdown timeout: in-flight messages finish first
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: order-service
          image: ${ACR_LOGIN_SERVER}/payflow/order-service:${IMAGE_TAG}
          ports:
            - containerPort: 8080
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: ServiceBus__FullyQualifiedNamespace, value: "${SERVICE_BUS_FQDN}" }
            - { name: Database__MigrateOnStartup, value: "true" }
          envFrom:
            - secretRef: { name: order-service-secrets }
          startupProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                        # process only: a database outage must not restart the pod
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
          readinessProbe:                       # dependencies: take the pod out of the Service while the database is down
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: order-service }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: payflow
spec:
  selector: { app: order-service }
  ports:
    - { port: 80, targetPort: 8080 }
